<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Failpack command and sanitized report</title>
  <description id="description">A failed test command on the left becomes a structured report with redacted paths and secrets on the right.</description>
  <rect width="1200" height="560" fill="#11110f"/>
  <rect x="30" y="30" width="540" height="500" rx="8" fill="#1a1a17" stroke="#454239"/>
  <rect x="600" y="30" width="570" height="500" rx="8" fill="#f7f4ee" stroke="#c9c2b5"/>
  <text x="56" y="68" fill="#aaa69c" font-family="Cascadia Mono, monospace" font-size="14">TERMINAL</text>
  <text x="626" y="68" fill="#746f66" font-family="Cascadia Mono, monospace" font-size="14">FAILPACK REPORT</text>

  <g font-family="Cascadia Mono, monospace" font-size="15" fill="#eee9df">
    <text x="56" y="112" fill="#e6b85c">PS&gt; failpack -- npm test</text>
    <text x="56" y="154">FAIL test/database.test.js</text>
    <text x="56" y="186" fill="#ff7468">Error: database connection refused</text>
    <text x="56" y="218">at C:\Users\Avery\work\api\db.js:42</text>
    <text x="56" y="250">DATABASE_PASSWORD=demo-value</text>
    <text x="56" y="298" fill="#87b6a0">Failpack wrote failpack-2026-07-21.md</text>
    <text x="56" y="330" fill="#aaa69c">Failure ID: a49a8461d73e</text>
    <text x="56" y="362" fill="#aaa69c">redactions: 3 · exit code: 1</text>
  </g>

  <g font-family="Cascadia Mono, monospace" font-size="14" fill="#292722">
    <text x="626" y="112" font-size="22" font-weight="700">Failpack report</text>
    <text x="626" y="148">npm test exited with code 1 after 1.24s.</text>
    <text x="626" y="190" fill="#8c5f27">Reproduction</text>
    <rect x="626" y="204" width="510" height="42" rx="5" fill="#e8e3d9"/>
    <text x="642" y="230">$ npm test</text>
    <text x="626" y="286" fill="#8c5f27">Standard error</text>
    <text x="626" y="322">Error: database connection refused</text>
    <text x="626" y="350">at C:\Users\&lt;USER&gt;\work\api\db.js:42</text>
    <text x="626" y="378">DATABASE_PASSWORD=&lt;SECRET&gt;</text>
    <text x="626" y="426" fill="#8c5f27">Environment</text>
    <text x="626" y="458">Windows 11 · x64 · Node 24 · Git clean</text>
    <text x="626" y="496" fill="#746f66">No upload. No env values. Review, then share.</text>
  </g>

  <path d="M574 280h20" stroke="#d89a55" stroke-width="2"/>
  <path d="m590 274 7 6-7 6" fill="none" stroke="#d89a55" stroke-width="2"/>
</svg>
